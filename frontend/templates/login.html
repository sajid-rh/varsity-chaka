{% extends "base.html" %}
{% block title %}Log in · Varsity Chaka{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Log in</h1>
  {% if error %}<div class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="/login" novalidate>
    <label for="email">University email</label>
    <input id="email" name="email" type="email" value="{{ form.email or '' }}" autocomplete="username" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" class="btn">Log in</button>
  </form>
  <p class="muted">New here? <a href="/register">Create an account</a></p>
</section>
{% endblock %}
